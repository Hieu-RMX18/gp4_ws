name: GP4 Rebuild CI

on:
  push:
    branches: [ws-deep-rebuild-3526, main]
  pull_request:
    branches: [ws-deep-rebuild-3526, main]

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pre-commit
      - run: pre-commit run --all-files

  typecheck-python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install mypy
      - run: mypy --strict --ignore-missing-imports src/llm_gateway src/safety hmi/backend

  typecheck-cpp:
    runs-on: ubuntu-22.04
    container:
      image: osrf/ros:humble-desktop
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update && apt-get install -y clang-tidy
          source /opt/ros/humble/setup.bash
          clang-tidy src/motion_core/src/*.cpp src/primitives/src/*.cpp \
            src/hw_adapter/src/*.cpp src/supervisor/src/*.cpp \
            -- -std=c++17 2>&1 || true

  build:
    runs-on: ubuntu-22.04
    container:
      image: osrf/ros:humble-desktop
    steps:
      - uses: actions/checkout@v4
      - run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install

  test-ros:
    runs-on: ubuntu-22.04
    container:
      image: osrf/ros:humble-desktop
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install
          colcon test
          colcon test-result --verbose

  test-hmi-backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install -r hmi/requirements.txt 2>/dev/null || true
          pip install pytest
          pytest hmi/backend/ -v || true

  test-hmi-frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: |
          cd hmi/frontend
          npm ci
          npm test || true

  duplication:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: |
          npm install -g jscpd
          jscpd src/ hmi/backend/ --min-lines 30 --min-tokens 70 --threshold 0

  dead-code:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install vulture
          vulture src/llm_gateway src/safety hmi/backend --min-confidence 80 || true

  safety-chain:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install pyyaml
          python tools/validate_safety_chain.py

  no-fallback-guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/lint/no_silent_motion_fallback.sh
