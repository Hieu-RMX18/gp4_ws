name: GP4 Rebuild CI

on:
  push:
    branches: [ws-deep-rebuild-3526, main]
  pull_request:
    branches: [ws-deep-rebuild-3526, main]

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pre-commit
      - run: pre-commit run --all-files

  typecheck-python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install mypy
      - run: mypy --strict --ignore-missing-imports src/llm_gateway src/safety hmi/backend

  typecheck-cpp:
    runs-on: ubuntu-22.04
    container:
      image: osrf/ros:humble-desktop
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update && apt-get install -y clang-tidy
          source /opt/ros/humble/setup.bash
          # Advisory-only: ROS 2 Humble headers produce noisy clang-tidy output.
          mapfile -t cpp_files < <(
            find src/motion_core/src src/primitives/src src/hw_adapter/src src/supervisor/src \
              -name '*.cpp' -print
          )
          clang-tidy "${cpp_files[@]}" -- -std=c++17 2>&1 || true

  build:
    runs-on: ubuntu-22.04
    container:
      image: osrf/ros:humble-desktop
    steps:
      - uses: actions/checkout@v4
      - run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install

  test-ros:
    runs-on: ubuntu-22.04
    container:
      image: osrf/ros:humble-desktop
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install
          mkdir -p /tmp/gp4_ws_ros_log /tmp/gp4_ws_ros_home
          env -u FASTRTPS_DEFAULT_PROFILES_FILE \
            ROS_LOG_DIR=/tmp/gp4_ws_ros_log \
            ROS_HOME=/tmp/gp4_ws_ros_home \
            ROS_LOCALHOST_ONLY=1 \
            colcon test
          colcon test-result --verbose

  test-hmi-backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install -r hmi/requirements.txt
          pip install pytest pyyaml jsonschema
          pytest hmi/backend/ -v

  test-hmi-frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: |
          cd hmi/frontend
          npm ci
          npm run build

  duplication:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: |
          npm install -g jscpd
          jscpd src/ hmi/backend/ --min-lines 30 --min-tokens 70 --threshold 48

  dead-code:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install vulture
          # Advisory-only: vulture can flag intentionally imported ROS/HMI entrypoints.
          vulture src/llm_gateway src/safety hmi/backend --min-confidence 80 || true

  safety-chain:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install pyyaml
          set +e
          python tools/validate_safety_chain.py 2> /tmp/safety_chain.err
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          cat /tmp/safety_chain.err
          if [ "$status" -eq 2 ]; then
            echo "::warning::Safety chain is fail-closed because perception extrinsics are not calibrated."
            exit 0
          fi
          exit "$status"

  no-fallback-guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/lint/no_silent_motion_fallback.sh
