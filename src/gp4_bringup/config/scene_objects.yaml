# HIL/production station model for GP4.
# Policy: keep only the real station mesh as planning-scene geometry.
# Legacy proxy boxes were removed to avoid mismatch with the real cell.

collision_objects:
  station_mesh:
    type: mesh
    resource: package://gp4_station/meshes/station3.stl
    scale: [0.001, 0.001, 0.001]
    pose:
      # Rotation derived from gp4_station/urdf/gp4_on_station.urdf.xacro:
      #   T_bm = inv(T_station_to_robot) * T_station_mesh
      # Current calibrated result in base_link:
      #   X[-0.482,+0.761] Y[-0.197,+0.806] Z[-0.757,+1.093] m.
      # Quaternion [x,y,z,w] = [0, 0, 1, 0]  (180-deg rotation about Z).
      position: [0.0, 0.0, 0.0]
      orientation: [0.0, 0.0, 1.0, 0.0]
    frame_id: base_link
