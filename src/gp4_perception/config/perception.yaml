# OpenCV HSV scale:
# H: 0..179
# S: 0..255
# V: 0..255
# HSV ranges use flat [h_min, s_min, v_min, h_max, s_max, v_max] format.

perception:
  workspace_bbox_m:
    x: [0.15, 0.70]
    y: [-0.35, 0.35]
    z: [0.01, 0.40]
  voxel_size_m: 0.008
  ransac_distance_threshold_m: 0.010
  cluster_tolerance_m: 0.025
  cluster_min_size: 200
  cluster_max_size: 10000
  # Plane removal: only remove planes whose normal is near-vertical (table/floor).
  # cos(~32deg) ~= 0.85. Keeps vertical object faces (e.g. red_box side) intact.
  ransac_plane_normal_z_min: 0.85
  # Minimum multi-factor confidence (colour vote + geometry + depth) to publish.
  min_publish_confidence: 0.55
  # Two-tier depth quality. Clusters whose depth noise exceeds the calibrated
  # (safe) breakpoint threshold but stay within this ceiling are published as
  # DEGRADED_DEPTH for visualization only — never executable. Above it: rejected.
  # Set allow_degraded_depth_detections: false to reject instead of degrade.
  depth_noise_degraded_mm_max: 15.0
  allow_degraded_depth_detections: true
  # Per-cluster RGB/HSV diagnostics in logs + /perception/debug_clusters overlay.
  debug_color_diagnostics: true
  # Temporal voting: publish only detections stable across frames.
  temporal_window_frames: 5
  temporal_min_hits: 3
  centroid_jitter_max_mm: 15.0
  temporal_miss_tolerance_frames: 2
  detection_ttl_s: 2.0
  pointcloud_processor:
    processing_rate_hz: 8.0
  depth_noise:
    # Range-aware threshold. D435i noise grows with distance; one flat number is wrong.
    # Linear interpolation between the breakpoints below.
    # NOTE: thresholds relaxed for USB 2.1 — tighten when USB 3.0 is available.
    breakpoints:
      - {distance_m: 0.30, noise_mm_max: 5.0}
      - {distance_m: 0.50, noise_mm_max: 8.0}
      - {distance_m: 0.80, noise_mm_max: 15.0}
    extrapolation: "clamp"    # outside breakpoints -> use nearest breakpoint

  # ---- RGB-first detector (unified_visualizer.py owns /perception/detections) ----
  rgb_detector:
    color_topic: /camera/color/image_raw
    depth_topic: /camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/color/camera_info
    depth_scale_m: 0.001          # 16UC1 raw units -> metres
    sync_slop_s: 0.05
    processing_rate_hz: 10.0
    sync_queue: 2
    base_frame: base_link
    camera_optical_frame: camera_color_optical_frame
    bbox_thickness_z_m: 0.03      # nominal Z extent (single deprojected point has none)

  # ---- Visualization ----
  visualization:
    annotated_image:
      layout: "side_by_side"   # side_by_side | rgb_only | depth_only
      show_compact_labels: true

    dashboard:
      enabled: true
      rate_hz: 2.0

    zoom_roi:
      enabled: false
      rate_hz: 5.0
      mode: "grid"             # single | grid | selected_class | selected_id
      top_n: 6
      grid_cols: 3
      grid_cell_size: 220
      margin_px: 20
      sort_by: "priority_then_score"
      selected_class: ""
      selected_id: -1

    label:
      font_scale: 0.75
      font_thickness: 2
      bbox_thickness: 3
      padding_px: 5
      line_spacing_px: 14
      background_alpha: 0.85
      decimals_xyz: 3
      score_decimals: 2
      distance_unit: "mm"      # mm | m

    qos:
      debug_images:
        reliability: "best_effort"   # reliable | best_effort
        depth: 1

    debug_masks:
      enabled: false
      publish_blue_border: true
      publish_white_workpiece: true

  # ---- Postprocess: cross-class NMS and pair suppression ----
  postprocess:
    class_priority:
      - red_box
      - white_workpiece
      - yellow_box
      - yellow_ball
      - orange
      - apple

    same_class_nms_iou: 0.50
    duplicate_cross_class_iou: 0.70

    pair_suppression:
      apple:
        red_box:
          center_inside: true
          iou_gt: 0.20
      orange:
        red_box:
          center_inside: true
          iou_gt: 0.20
      white_workpiece:
        red_box:
          fully_inside_only: true

  visual_tracking:
    enabled: true
    min_hits: 2
    miss_tolerance_frames: 2
    max_centroid_distance_px: 45.0
    min_iou: 0.15
    ema_alpha: 0.35

  # ---- Color classes: HSV mask source of truth for 2D detection path ----
  # Ranges are [h_min, s_min, v_min, h_max, s_max, v_max] in OpenCV HSV.
  color_classes:
    - class_id: red_box
      enabled: true
      hsv_ranges:
        - [0, 90, 60, 10, 255, 255]
        - [170, 90, 60, 179, 255, 255]
      min_area_px: 800
      max_area_px: 200000
      morph_kernel: 3
      require_border: null
      shape_filter:
        min_solidity: 0.75
        min_aspect_ratio: 0.3
        max_aspect_ratio: 3.5

    - class_id: yellow_box
      enabled: true
      hsv_ranges:
        - [18, 60, 60, 40, 255, 255]
      min_area_px: 500
      max_area_px: 80000
      morph_kernel: 3
      require_border: null
      shape_filter:
        min_solidity: 0.70
        min_aspect_ratio: 0.45
        max_aspect_ratio: 3.0

    - class_id: yellow_ball
      enabled: false            # disabled — no real yellow ball in current workspace
      hsv_ranges:
        - [18, 60, 60, 40, 255, 255]
      min_area_px: 300
      max_area_px: 40000
      morph_kernel: 3
      require_border: null
      shape_filter:
        min_circularity: 0.70
        max_aspect_ratio: 1.3

    - class_id: orange
      enabled: true
      hsv_ranges:
        - [8, 80, 60, 25, 255, 255]
      min_area_px: 300
      max_area_px: 60000
      morph_kernel: 3
      require_border: null
      shape_filter:
        min_circularity: 0.55
        max_aspect_ratio: 1.6

    - class_id: apple
      enabled: true
      hsv_ranges:
        - [0, 90, 60, 10, 255, 255]
        - [170, 90, 60, 179, 255, 255]
      min_area_px: 300
      max_area_px: 60000
      morph_kernel: 3
      require_border: null
      shape_filter:
        min_circularity: 0.55
        max_aspect_ratio: 1.6

    - class_id: white_workpiece
      enabled: true
      detector_type: "blue_border_white_fill"
      min_area_px: 500
      max_area_px: 30000
      morph_kernel: 5
      require_border: null          # handled by detector_type
      blue_border_hsv: [95, 50, 40, 135, 255, 255]
      white_fill_hsv: [0, 0, 135, 179, 90, 255]
      inner_white_min_ratio: 0.45
      min_blue_border_ratio: 0.04
      shape_filter:
        min_aspect_ratio: 0.4
        max_aspect_ratio: 4.0
      reject_if_inside_class: red_box
