llm_backend:
  provider: "provider"
  base_url: "http://"
  # API key loaded from environment variable GP4_LLM_API_KEY
  # NEVER commit plaintext keys to the repository.
  api_key: "sk-secrect-key"
  api_mode: "openai_compatible"
  model: ""
  temperature: 0.0
  max_tokens: 3618
  require_json_only: true
  fail_on_non_json: true
  fail_on_schema_mismatch: true
  request_timeout_sec: 30.0
