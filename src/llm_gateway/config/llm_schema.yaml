$schema: "http://json-schema.org/draft-07/schema#"
title: "Phase9ExecuteMotionCommand"
type: object
additionalProperties: false
required:
  - primitive_type
properties:
  primitive_type:
    type: string
    enum:
      - HOME
      - PTP
      - LIN
      - CIRC
      - CARTESIAN_PATH
      - MOVE_REL
      - GET_POSE
      - SET_SPEED
      - WAIT
      - STOP
      - MOVE_JOINT
      - IO_SET
      - ALARM_RESET
      - MOVE_JOINTS
  target_pose:
    type: object
    additionalProperties: false
    required:
      - position
    properties:
      position:
        type: object
        additionalProperties: false
        required:
          - x
          - y
          - z
        properties:
          x:
            type: number
          y:
            type: number
          z:
            type: number
      orientation:
        anyOf:
          - type: object
            additionalProperties: false
            required:
              - x
              - y
              - z
              - w
            properties:
              x:
                type: number
              y:
                type: number
              z:
                type: number
              w:
                type: number
          - type: object
            additionalProperties: false
            required:
              - roll
              - pitch
              - yaw
            properties:
              roll:
                type: number
              pitch:
                type: number
              yaw:
                type: number
  waypoints:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - position
      properties:
        position:
          type: object
          additionalProperties: false
          required:
            - x
            - y
            - z
          properties:
            x:
              type: number
            y:
              type: number
            z:
              type: number
        orientation:
          anyOf:
            - type: object
              additionalProperties: false
              required:
                - x
                - y
                - z
                - w
              properties:
                x:
                  type: number
                y:
                  type: number
                z:
                  type: number
                w:
                  type: number
            - type: object
              additionalProperties: false
              required:
                - roll
                - pitch
                - yaw
              properties:
                roll:
                  type: number
                pitch:
                  type: number
                yaw:
                  type: number
  joint_target:
    type: array
    minItems: 6
    maxItems: 6
    items:
      type: number
  velocity_scale:
    type: number
    minimum: 0.01
    maximum: 0.06
  acceleration_scale:
    type: number
    minimum: 0.01
    maximum: 0.06
  planner_id:
    type: string
    enum:
      - PILZ_LIN
      - PILZ_PTP
      - PILZ_CIRC
      - OMPL_RRTConnect
  plan_only:
    type: boolean
  chunk_index:
    type: integer
    minimum: 1
  stroke_index:
    type: integer
    minimum: 1
  delta_x:
    type: number
  delta_y:
    type: number
  delta_z:
    type: number
  linear_unit:
    type: string
    enum:
      - m
      - cm
      - mm
  angular_unit:
    type: string
    enum:
      - rad
      - deg
  reference_frame:
    type: string
    enum:
      - base_link
  wait_duration_sec:
    type: number
    minimum: 0.0
    maximum: 60.0
  joint_index:
    type: integer
    minimum: 0
    maximum: 5
  joint_angle:
    type: number
  io_address:
    type: integer
    minimum: 0
  io_value:
    type: integer
    enum:
      - 0
      - 1
allOf:
  - if:
      properties:
        primitive_type:
          const: LIN
    then:
      required:
        - target_pose
  - if:
      properties:
        primitive_type:
          const: CIRC
    then:
      required:
        - target_pose
        - waypoints
      properties:
        waypoints:
          minItems: 1
          maxItems: 1
  - if:
      properties:
        primitive_type:
          const: CARTESIAN_PATH
    then:
      required:
        - waypoints
  - if:
      properties:
        primitive_type:
          const: PTP
    then:
      anyOf:
        - required:
            - target_pose
        - required:
            - joint_target
  - if:
      properties:
        primitive_type:
          const: MOVE_REL
    then:
      required:
        - delta_x
        - delta_y
        - delta_z
  - if:
      properties:
        primitive_type:
          const: SET_SPEED
    then:
      required:
        - velocity_scale
  - if:
      properties:
        primitive_type:
          const: WAIT
    then:
      required:
        - wait_duration_sec
  - if:
      properties:
        primitive_type:
          const: MOVE_JOINT
    then:
      required:
        - joint_index
        - joint_angle
  - if:
      properties:
        primitive_type:
          const: IO_SET
    then:
      required:
        - io_address
        - io_value
  - if:
      properties:
        primitive_type:
          const: MOVE_JOINTS
    then:
      required:
        - joint_target
