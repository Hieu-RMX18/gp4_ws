# Hardware conservative limits for the real GP4 workcell.
# Source of truth: station3.stl bounding box in base_link (from current gp4_station xacro)
#   Station in base_link: X[-0.482, +0.761] Y[-0.197, +0.806] Z[-0.757, +1.093]
#   GP4 reach: 550 mm. Safety margin: 30 mm.
# Notes:
#   - workspace_bounds derived from station walls + GP4 reach, whichever is closer.
#     30 mm kept from every physical boundary (user rule: max - 30 mm).
#   - forbidden_zones are inflated 30 mm pre-planning checks in front of MoveIt
#     mesh collision. MoveIt station_mesh remains the authoritative geometry check.
workspace_bounds:
  x_min: -0.45   # station near side -0.482m + 30mm ~= -0.452m (conservative rounded)
  x_max:  0.45   # conservative cap; do not expand positive X for hardware pass
  y_min: -0.16   # station front wall -0.197m + 37mm; kept above front_wall_guard max
  y_max:  0.52   # reach-limited  (back wall at +0.806m, beyond reach)
  z_min:  0.23   # table-top estimated 0.20m + 30mm margin
  z_max:  0.52   # conservative cap; keeps motions in validated commissioning envelope

# Backward-compatible keys still used by safety.command_validator.
joint_limits_override:
  max_velocity_scale: 0.06
  max_acceleration_scale: 0.06

# Preferred conservative hardware motion policy for new consumers.
motion_limits:
  max_velocity_scale: 0.06
  max_acceleration_scale: 0.06
  max_move_rel_translation: 0.05

forbidden_zones:
  # Station front face (Y = -0.197m in base_link).  30mm zone each side of wall.
  # Spans Y: [-0.227, -0.167]. Covers full station width and robot height.
  - name: front_wall_guard
    x:  0.00
    y: -0.197
    z:  0.00
    size_x: 1.30
    size_y: 0.06
    size_z: 1.50

  # Station side wall nearest robot negative-X side (X = -0.482m in base_link).
  # 30mm zone each side of wall. Spans X: [-0.512, -0.452].
  - name: right_wall_guard
    x: -0.482
    y:  0.305
    z:  0.00
    size_x: 0.06
    size_y: 1.10
    size_z: 1.50

  # Low-Z floor/table clearance. Defence-in-depth under workspace z_min.
  # Spans Z: [0.00, 0.20]. Prevents inadvertent descent into table surface.
  - name: floor_clearance_guard
    x:  0.00
    y:  0.30
    z:  0.10
    size_x: 1.50
    size_y: 1.10
    size_z: 0.20

require_human_approval:
  # Advisory only for now (current code path does not enforce this key directly).
  # Keep below hardware motion max so operator review policy remains conservative.
  velocity_scale_threshold: 0.05
  distance_from_home_threshold: 0.30
